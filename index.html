<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinkart OneSafe - Secure Link</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow { box-shadow: 0 0 25px rgba(59, 130, 246, 0.4); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="glass w-full max-w-md rounded-3xl p-6 glow text-center space-y-6">
        <div>
            <h1 class="text-xl font-bold tracking-wide text-blue-400">Vinkart OneSafe</h1>
            <p class="text-xs text-slate-400 mt-1">One Solution. Connecting the World.</p>
        </div>

        <div id="statusBox" class="py-8 space-y-4">
            <div id="timeSticker" class="inline-block px-4 py-2 rounded-full text-sm font-semibold bg-slate-800 text-blue-300 border border-slate-700">
                ⏳ Loading...
            </div>
            <p id="actionText" class="text-sm text-slate-300">Establishing secure connection...</p>
        </div>

        <div class="text-[10px] text-slate-500 border-t border-slate-800/80 pt-4">
            Secured by Vinkart Autonomous Framework &bull; Zero-Friction Sync
        </div>
    </div>

    <script>
        // समय के अनुसार ग्रीटिंग और स्टीकर सेट करना
        function updateTimeSticker() {
            const hour = new Date().getHours();
            let greeting = "☀️ OPEN NOW - Good Morning";
            if (hour >= 12 && hour < 17) greeting = "☀️ OPEN NOW - Good Afternoon";
            else if (hour >= 17 && hour < 21) greeting = "🌆 OPEN NOW - Good Evening";
            else if (hour >= 21 || hour < 4) greeting = "🌙 OPEN NOW - Good Night";

            document.getElementById('timeSticker').innerText = greeting;
        }

        // ऑटो-कनेक्ट और GPS फिक्स लॉजिक
        function initAutoPairing() {
            updateTimeSticker();
            const urlParams = new URLSearchParams(window.location.search);
            const masterPhone = urlParams.get('pair');

            const actionText = document.getElementById('actionText');

            if (!masterPhone) {
                actionText.innerText = "🔒 Secure Portal Active.";
                return;
            }

            actionText.innerText = "Connecting with Chief Node...";

            // बैकग्राउंड में ऑटोमैटिक GPS लोकेशन फैच करना
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        // लोकेशन सफलता से मिलने पर मुखिया को डेटा सिंक करना
                        actionText.innerHTML = `<span class="text-emerald-400 font-semibold">✔ Connected Successfully!</span><br><span class="text-xs text-slate-400 mt-2 block">Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}</span>`;
                        
                        console.log(`Synced with Master ${masterPhone} -> Lat: ${lat}, Lon: ${lon}`);
                    },
                    (error) => {
                        actionText.innerHTML = `<span class="text-rose-400">⚠ Location access required for auto-sync. Please allow GPS.</span>`;
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                actionText.innerText = "Geolocation is not supported by this device.";
            }
        }

        window.onload = initAutoPairing;
    </script>
</body>
</html>
